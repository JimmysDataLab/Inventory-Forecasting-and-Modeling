services:
  spark-master:
    image: bitnami/spark:3.5.4
    container_name: spark-master
    environment:
      - SPARK_MODE=master
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - sparknet
    volumes:
      - /Users/akhil/Projects/store-sales-time-series-forecasting/data:/Users/akhil/Projects/store-sales-time-series-forecasting/data

  spark-worker-1:
    image: bitnami/spark:3.5.4
    container_name: spark-worker-1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    depends_on:
      - spark-master
    networks:
      - sparknet
    volumes:
      - /Users/akhil/Projects/store-sales-time-series-forecasting/data:/Users/akhil/Projects/store-sales-time-series-forecasting/data

  spark-worker-2:
    image: bitnami/spark:3.5.4
    container_name: spark-worker-2
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    depends_on:
      - spark-master
    networks:
      - sparknet
    volumes:
      - /Users/akhil/Projects/store-sales-time-series-forecasting/data:/Users/akhil/Projects/store-sales-time-series-forecasting/data

networks:
  sparknet:
