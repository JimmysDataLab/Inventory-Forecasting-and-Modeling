services:
  spark-master:
    image: bitnami/spark:3.5.4
    environment:
      - SPARK_MODE=master
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - sparknet
    volumes:
      - ./data:/data

  spark-worker-1:
    image: bitnami/spark:3.5.4
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    depends_on:
      - spark-master
    networks:
      - sparknet
    volumes:
      - ./data:/data

  spark-worker-2:
    image: bitnami/spark:3.5.4
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    depends_on:
      - spark-master
    networks:
      - sparknet
    volumes:
      - ./data:/data

networks:
  sparknet:
